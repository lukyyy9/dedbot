version: '3.8'
services:
  # DedBot - Service unifié (Bot DCA + Interface Web d'Administration)
  dedbot:
    image: imluky/dedbot:latest
    container_name: dedbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "5001:5001"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    environment:
      - TZ=Europe/Paris
      - DEV=false  # "false" = 1x par jour, "true" = 1x par minute
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
    tmpfs:
      - /tmp:rw,size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
